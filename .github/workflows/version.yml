name: Version check

on:
  pull_request:
    branches: ['MOODLE_*_STABLE', 'mdl*-*']

permissions:
  contents: read

jobs:
  version:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@version-policy-changes
    with:
      internal_workflow_branch: version-policy-changes
      internal_workflow_repository: catalyst/catalyst-moodle-workflows
      moodle_plugin_ci_repo: https://github.com/catalyst/moodle-plugin-ci.git
      moodle_plugin_ci_ref: 391-version-validation
      disable_behat: true
      disable_mustache: true
      disable_phplint: true
      disable_phpdoc: true
      disable_phpcs: true
      disable_phpunit: true
      disable_grunt: true
      disable_master: true
      disable_release: true
      enable_release: false
      disable_ci_validate: true
      version_branch_pattern: '/^mdl(?<version>[0-9]+)-(?<group>[a-z0-9]+)$/'
