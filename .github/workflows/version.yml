name: Version check

on:
  pull_request:
    branches: ['MOODLE_*_STABLE']

permissions:
  contents: read

jobs:
  version:
    uses: matthewhilton/catalyst-moodle-workflows/.github/workflows/ci.yml@version-bump-check
    with:
      internal_workflow_branch: version-bump-check
      moodle_plugin_ci_repo: https://github.com/matthewhilton/moodle-plugin-ci.git
      moodle_plugin_ci_ref: 391-version-validation
      disable_behat: true
      disable_mustache: true
      disable_phplint: true
      disable_phpdoc: true
      disable_phpcs: true
      disable_phpunit: true
      disable_grunt: true
      disable_master: true
      disable_release: true
      disable_ci_validate: true
